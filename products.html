<script>
  // بيثبّت جذر الموقع الحقيقي كأساس لأي رابط أو صورة نسبية في الصفحة،
  // عشان لما شريط العنوان يتغيّر شكله (زي لينكات المنتجات /p/...) الصور
  // والروابط الداخلية (زي "الرئيسية") تفضل شغالة صح من غير ما تتكسر.
  // لازم يجري ده أول حاجة في <head> قبل أي رابط نسبي تاني.
  (function(){
    var dir = location.pathname.replace(/[^/]*$/, '');
    var base = document.createElement('base');
    base.href = location.origin + dir;
    document.head.appendChild(base);
  })();
</script>
