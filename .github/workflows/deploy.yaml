name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build products index
        run: npm run build

      # بيولّد data/env.json من GitHub Secrets وقت النشر بس — الملف ده
      # مش موجود في الكود المصدري إطلاقًا، ومن غيره الموقع مبيقدرش
      # يتصل بـ Supabase خالص (تسجيل الدخول/حساب جديد بيفشلوا برسالة
      # "الخدمة غير متاحة"). لازم تضيف الأسرار دي في Settings → Secrets
      # and variables → Actions (تفاصيلها في ENV_SETUP.md)
      - name: Generate env.json
        run: |
          mkdir -p data
          cat > data/env.json << EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "TURNSTILE_SITE_KEY": "${{ secrets.TURNSTILE_SITE_KEY }}"
          }
          EOF

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,scripts,README.md,package.json,.gitignore,.telegram'
          force_orphan: true
